<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enlaza — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --paper:#F6FAFC; --paper-raised:#FFFFFF; --line:#DCE7EC;
    --ink:#1D2A32; --ink-soft:#4A5E68; --ink-faint:#8AA0AC;
    --petroleo:#0B4F6C; --petroleo-deep:#083A4F;
    --coral:#FF6B4A; --coral-deep:#E0512F;
    --ember:#FF5A36; --ember-deep:#D8431F; --moss:#5B8072; --clay:#AA6B5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(900px 460px at -5% -10%, rgba(11,79,108,0.08), transparent 55%),
      radial-gradient(800px 440px at 105% 10%, rgba(255,107,74,0.06), transparent 55%),
      radial-gradient(700px 400px at 50% 115%, rgba(91,128,114,0.07), transparent 55%);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  .card{
    width:100%; max-width:380px; text-align:center;
    background:var(--paper-raised); border:1px solid var(--line);
    border-top:4px solid var(--petroleo);
    border-radius:16px; padding:44px 34px;
    box-shadow:0 30px 60px -28px rgba(13,30,40,0.22);
  }
  .logo-mark{
    width:48px; height:48px; border-radius:12px; margin:0 auto 20px;
    background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 22px -8px rgba(11,79,108,0.25);
  }
  .logo-mark svg{ width:30px; height:30px; display:block; }
  h1{
    font-family:'Archivo',sans-serif; font-weight:900; letter-spacing:-0.02em;
    font-size:1.7rem; margin:0 0 10px;
  }
  p{ color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0 0 30px; }
  #googleBtn{ display:flex; justify-content:center; }
  #errBox{
    display:none; margin-top:18px; font-size:12.5px; color:var(--coral-deep);
    background:var(--coral-tint, rgba(255,107,74,0.1)); border:1px solid rgba(255,107,74,0.3);
    padding:10px 14px; border-radius:8px;
  }
  #errBox.show{ display:block; }
  .fine{
    margin-top:26px; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    color:var(--ink-faint); letter-spacing:.03em; line-height:1.6;
  }
  .fine a{ color:var(--ink-faint); text-decoration:underline; }
  .fine a:hover{ color:var(--petroleo); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-mark"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="16" r="7" stroke="#0B4F6C" stroke-width="3"/><circle cx="20" cy="16" r="7" stroke="#FF6B4A" stroke-width="3"/></svg></div>
    <h1>Enlaza</h1>
    <p>Inicia sesión con tu cuenta de Google para entrar a tu kárdex.</p>
    <div id="googleBtn"></div>
    <div id="errBox"></div>
    <div class="fine">Cada cuenta ve solo sus propios clientes y facturas.<br>
      Al iniciar sesión, aceptas los <a href="/terminos.html">Términos de Uso</a> y la
      <a href="/privacidad.html">Política de Privacidad</a>.
    </div>
  </div>


<script>
async function handleCredentialResponse(response) {
  const errBox = document.getElementById('errBox');
  errBox.classList.remove('show');
  try {
    const res = await fetch('/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión.');
    window.location.href = '/';
  } catch (e) {
    errBox.textContent = 'No se pudo iniciar sesión: ' + e.message;
    errBox.classList.add('show');
  }
}

window.onload = function () {
  if (!window.GOOGLE_CLIENT_ID) {
    document.getElementById('errBox').textContent = 'Falta configurar GOOGLE_CLIENT_ID en el servidor.';
    document.getElementById('errBox').classList.add('show');
    return;
  }
  google.accounts.id.initialize({
    client_id: window.GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById('googleBtn'),
    { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' }
  );
};
</script>
</body>
</html>
